<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fav-outer" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="fav-visor" x1="18" y1="22" x2="46" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Cyber Hex Outer Shield -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18"
           stroke="url(#fav-outer)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
           fill="#0b0e18" />

  <!-- Visor -->
  <rect x="18" y="22" width="28" height="9" rx="4.5" fill="url(#fav-visor)" />
  <circle cx="27" cy="26.5" r="1.6" fill="#ffffff" />
  <circle cx="37" cy="26.5" r="1.6" fill="#ffffff" />

  <!-- Quantum Core Pulse -->
  <circle cx="32" cy="42" r="5" fill="#6366f1" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="32" cy="42" r="2" fill="#38bdf8" />
  <line x1="32" y1="31" x2="32" y2="37" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fav-shield" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="fav-visor" x1="16" y1="20" x2="48" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <radialGradient id="fav-core" cx="32" cy="45" r="7" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </radialGradient>
  </defs>

  <!-- Outer Cyber Hex Shield -->
  <polygon points="32,3 60,17 60,47 32,61 4,47 4,17"
           fill="#07090e"
           stroke="url(#fav-shield)"
           stroke-width="3.5"
           stroke-linejoin="round" />

  <!-- Inner Tech Inset -->
  <polygon points="32,8 54,19 54,45 32,56 10,45 10,19"
           fill="#0f1424"
           stroke="#818cf8"
           stroke-width="1"
           stroke-opacity="0.4"
           stroke-linejoin="round" />

  <!-- High-Contrast Visor -->
  <rect x="16" y="20" width="32" height="11" rx="5.5" fill="url(#fav-visor)" />
  <circle cx="24" cy="25.5" r="2" fill="#0b0e18" />
  <circle cx="24" cy="25.5" r="1" fill="#ffffff" />
  <circle cx="40" cy="25.5" r="2" fill="#0b0e18" />
  <circle cx="40" cy="25.5" r="1" fill="#ffffff" />

  <!-- Synapse Connector -->
  <line x1="32" y1="31" x2="32" y2="39" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />

  <!-- Quantum AI Motor Core -->
  <circle cx="32" cy="45" r="5.5" fill="url(#fav-core)" stroke="#ffffff" stroke-width="1.2" />
  <circle cx="32" cy="45" r="2" fill="#ffffff" />

  <!-- Lower Bipedal Foundation Pip -->
  <circle cx="32" cy="54" r="1.8" fill="#10b981" />
</svg>

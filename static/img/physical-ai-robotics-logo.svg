<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <!-- Outer Cyber Glow -->
    <radialGradient id="cyber-glow" cx="80" cy="80" r="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#06b6d4" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#05070d" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Obsidian Shield Surface -->
    <linearGradient id="shield-base" x1="20" y1="12" x2="140" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181e33" />
      <stop offset="45%" stop-color="#0e1322" />
      <stop offset="100%" stop-color="#080b14" />
    </linearGradient>

    <!-- Primary Neon Bevel Gradient -->
    <linearGradient id="shield-border" x1="16" y1="14" x2="144" y2="146" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="28%" stop-color="#818cf8" />
      <stop offset="65%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Inner Core Hex Gradient -->
    <linearGradient id="inner-hex-border" x1="30" y1="26" x2="130" y2="134" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7" />
    </linearGradient>

    <!-- Humanoid Faceplate Gradient -->
    <linearGradient id="humanoid-cowl" x1="48" y1="34" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#242b45" />
      <stop offset="50%" stop-color="#151b2e" />
      <stop offset="100%" stop-color="#0a0e1c" />
    </linearGradient>

    <!-- Holographic Perception Visor -->
    <linearGradient id="holographic-visor" x1="50" y1="58" x2="110" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <!-- Quantum Synapse Glow -->
    <linearGradient id="synapse-glow" x1="80" y1="74" x2="80" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Quantum Core Radial -->
    <radialGradient id="quantum-core" cx="80" cy="100" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#67e8f9" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#312e81" />
    </radialGradient>

    <!-- Filter for Visor Bloom Glow -->
    <filter id="bloom-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="core-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Background Ambient Atmosphere -->
  <circle cx="80" cy="80" r="74" fill="url(#cyber-glow)" />

  <!-- Outer Cyber Chassis Polygon (Sculpted Hexagon) -->
  <polygon points="80,10 144,45 144,115 80,150 16,115 16,45"
           fill="url(#shield-base)"
           stroke="url(#shield-border)"
           stroke-width="3.5"
           stroke-linejoin="round"
           stroke-linecap="round" />

  <!-- Inner Precision Tech Inset -->
  <polygon points="80,20 134,50 134,110 80,140 26,110 26,50"
           fill="none"
           stroke="url(#inner-hex-border)"
           stroke-width="1.2"
           stroke-dasharray="8 4"
           stroke-linejoin="round" />

  <!-- Corner Tech Accent Pips -->
  <circle cx="80" cy="18" r="2.2" fill="#38bdf8" />
  <circle cx="136" cy="49" r="2.2" fill="#818cf8" />
  <circle cx="136" cy="111" r="2.2" fill="#6366f1" />
  <circle cx="80" cy="142" r="2.2" fill="#10b981" />
  <circle cx="24" cy="111" r="2.2" fill="#06b6d4" />
  <circle cx="24" cy="49" r="2.2" fill="#38bdf8" />

  <!-- Humanoid Cranial Armor Helmet Silhouette -->
  <path d="M52 48 C52 32 64 24 80 24 C96 24 108 32 108 48 V80 C108 96 95 114 80 122 C65 114 52 96 52 80 Z"
        fill="url(#humanoid-cowl)"
        stroke="url(#shield-border)"
        stroke-width="2.5"
        stroke-linejoin="round" />

  <!-- Forehead Neural Telemetry Array -->
  <path d="M72 32 H88 M75 36 H85" stroke="#67e8f9" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
  <circle cx="80" cy="41" r="2" fill="#38bdf8" />

  <!-- High-Tech Panoramic Visor (Embodied Perception Sensor) -->
  <g filter="url(#bloom-filter)">
    <path d="M50 56 C50 52 56 50 64 50 H96 C104 50 110 52 110 56 V67 C110 71 104 73 96 73 H64 C56 73 50 71 50 67 Z"
          fill="url(#holographic-visor)" />
  </g>

  <!-- Dual Stereoscopic Ocular Optical Lenses -->
  <circle cx="68" cy="61.5" r="3.2" fill="#0a1020" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="68" cy="61.5" r="1.4" fill="#38bdf8" />

  <circle cx="92" cy="61.5" r="3.2" fill="#0a1020" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="92" cy="61.5" r="1.4" fill="#38bdf8" />

  <!-- Visor Center Laser Scanner Slit -->
  <line x1="74" y1="61.5" x2="86" y2="61.5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />

  <!-- Synaptic Data Conduits (Neural Pathways to Core) -->
  <path d="M80 73 V90" stroke="url(#synapse-glow)" stroke-width="2.4" stroke-linecap="round" />
  <path d="M66 73 L74 91" stroke="url(#synapse-glow)" stroke-width="1.8" stroke-linecap="round" />
  <path d="M94 73 L86 91" stroke="url(#synapse-glow)" stroke-width="1.8" stroke-linecap="round" />

  <!-- Side Biomechanical Jaw / Actuator Ports -->
  <rect x="47" y="78" width="5" height="12" rx="2.5" fill="#38bdf8" opacity="0.75" />
  <rect x="108" y="78" width="5" height="12" rx="2.5" fill="#38bdf8" opacity="0.75" />

  <!-- Quantum AI Motor & Embodied Engine Core -->
  <g filter="url(#core-glow)">
    <circle cx="80" cy="100" r="9.5" fill="url(#quantum-core)" stroke="#ffffff" stroke-width="2" />
    <circle cx="80" cy="100" r="4" fill="#ffffff" />
  </g>

  <!-- Biomechanical Locomotion / Kinematics Bridge (Bipedal Stance Chevrons) -->
  <path d="M62 115 L80 126 L98 115"
        stroke="url(#shield-border)"
        stroke-width="2.6"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <path d="M68 123 L80 131 L92 123"
        stroke="#10b981"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.9" />

  <!-- Pulse Emitter Node -->
  <circle cx="80" cy="131" r="2" fill="#10b981" />
</svg>
